name: travel-os
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travelos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-travel_os_demo}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      retries: 12
  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-travelos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-travel_os_demo}
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-travelos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-travel_os_demo}
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
